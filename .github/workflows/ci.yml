name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Each job runs in a fresh lims-runner container on the owner's Mac (ci/runner/README.md) and starts the
# PostgreSQL 18.6 inside it, so a job's cluster and workspace go when its container does. Each job has its own
# runner, because two e2e jobs at once do not fit in the Docker VM's memory.
jobs:
  check:
    runs-on: [self-hosted, lims-check]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.15.0
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: 0.12.12
      - run: pnpm install --frozen-lockfile
      - run: scripts/pg.sh start
      - run: pnpm check

  e2e:
    runs-on: [self-hosted, lims-e2e]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.15.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @lims/web exec playwright install --with-deps chromium webkit
      - run: scripts/pg.sh start
      - run: pnpm e2e
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-api-log-and-results
          path: |
            apps/web/api-log/
            apps/web/test-results/
