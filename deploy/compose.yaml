# The Mac deploy (ADR 0002): Caddy, the API and PostgreSQL 18, reached only through a Cloudflare
# Tunnel. Start it with deploy/mac/start.sh, which sets LIMS_SECRETS_DIR and LIMS_DATA_CLASS.
# Named volumes only; `pnpm check:deploy` fails on any bind mount.
name: nitrosamine-lims

x-hardened: &hardened
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  restart: unless-stopped

x-api-build: &api-build
  context: ..
  dockerfile: deploy/api.Dockerfile

services:
  postgres:
    image: postgres:18.6-bookworm@sha256:3725f4e2499eef5134592b3b4ab79a543ed7f8e533b05b5b637af926630f6650
    # Operator logs (ADR 0002): every connection, disconnection and, for the superuser and the
    # migrator (db-init sets log_statement per role), every statement, written into the pgdata
    # volume beside the data they describe.
    command:
      - postgres
      - -c
      - timezone=UTC
      - -c
      - default_transaction_isolation=read committed
      - -c
      - password_encryption=scram-sha-256
      - -c
      - logging_collector=on
      - -c
      - log_directory=log
      - -c
      - log_filename=postgresql-%Y-%m-%d.log
      - -c
      - log_file_mode=0600
      - -c
      - log_rotation_age=1d
      - -c
      - log_connections=on
      - -c
      - log_disconnections=on
      - -c
      - "log_line_prefix=%m [%p] user=%u db=%d host=%h app=%a "
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/db_superuser_password
      POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale=C
    secrets:
      - { source: db_superuser_password, uid: "999", gid: "999", mode: 0400 }
    volumes:
      - pgdata:/var/lib/postgresql
    networks: [db]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    stop_grace_period: 60s
    healthcheck:
      test: [CMD, pg_isready, -U, postgres, -d, postgres]
      interval: 5s
      timeout: 3s
      retries: 20

  # One-shot: creates the cluster roles through packages/db's runner, sets the two login roles'
  # passwords, creates the database and applies the migrations. Safe to rerun on every start.
  db-init:
    <<: *hardened
    restart: "no"
    image: nitrosamine-lims/api:${LIMS_RELEASE:-local}
    build: *api-build
    command: [node, deploy/db/init.ts]
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: lims
      LIMS_DATA_CLASS: ${LIMS_DATA_CLASS:?deploy/mac/start.sh sets the data class}
      LIMS_STATE_DIR: /var/lib/lims/state
    volumes:
      - state:/var/lib/lims/state
    secrets:
      - { source: db_superuser_password, uid: "1000", gid: "1000", mode: 0400 }
      - { source: db_migrator_password, uid: "1000", gid: "1000", mode: 0400 }
      - { source: db_app_password, uid: "1000", gid: "1000", mode: 0400 }
    tmpfs: ["/run/lims:uid=1000,gid=1000,mode=0700"]
    networks: [db]
    depends_on:
      postgres: { condition: service_healthy }

  api:
    <<: *hardened
    image: nitrosamine-lims/api:${LIMS_RELEASE:-local}
    build: *api-build
    environment:
      PORT: "3000"
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: lims
      PGUSER: lims_app
      LIMS_DATA_CLASS: ${LIMS_DATA_CLASS:?deploy/mac/start.sh sets the data class}
      LIMS_REPORT_STORE: /var/lib/lims/reports
      LIMS_TOTP_ENCRYPTION_KEY_FILE: /run/secrets/totp_encryption_key
      LIMS_PASSWORD_PEPPER_FILE: /run/secrets/password_pepper
      LIMS_WORKER_UPLOAD_TOKEN_FILE: /run/secrets/worker_upload_token
      LIMS_WORKER_ALARM_TOKEN_FILE: /run/secrets/worker_alarm_token
      LIMS_AGE_PUBLIC_KEY_FILE: /run/secrets/age_public_key
    secrets:
      - { source: db_app_password, uid: "1000", gid: "1000", mode: 0400 }
      - { source: totp_encryption_key, uid: "1000", gid: "1000", mode: 0400 }
      - { source: password_pepper, uid: "1000", gid: "1000", mode: 0400 }
      - { source: worker_upload_token, uid: "1000", gid: "1000", mode: 0400 }
      - { source: worker_alarm_token, uid: "1000", gid: "1000", mode: 0400 }
      - { source: age_public_key, uid: "1000", gid: "1000", mode: 0400 }
    volumes:
      - reports:/var/lib/lims/reports
    tmpfs: ["/run/lims:uid=1000,gid=1000,mode=0700", "/tmp"]
    networks: [db, edge, egress]
    depends_on:
      db-init: { condition: service_completed_successfully }

  web:
    <<: *hardened
    image: nitrosamine-lims/web:${LIMS_RELEASE:-local}
    build:
      context: ..
      dockerfile: deploy/web.Dockerfile
      args:
        CADDYFILE: Caddyfile.tunnel
    cap_add: [NET_BIND_SERVICE]
    tmpfs: ["/data", "/config"]
    networks: [edge]
    depends_on: [api]

  tunnel:
    <<: *hardened
    profiles: [tunnel]
    image: cloudflare/cloudflared:2026.9.3@sha256:072c067d25ccbe61d46e18f0d0723255f2bb5304f7317caa95b27031520ff92c
    command: [tunnel, --config, /run/secrets/tunnel_config, run]
    secrets:
      - { source: tunnel_config, uid: "65532", gid: "65532", mode: 0400 }
      - { source: tunnel_credentials, uid: "65532", gid: "65532", mode: 0400 }
    networks: [edge, egress]
    depends_on: [web]

networks:
  # No route out: Postgres and Caddy reach only their neighbours.
  db: { internal: true }
  edge: { internal: true }
  # Outbound only (nothing is published): the API calls the Worker, cloudflared dials Cloudflare.
  egress: {}

volumes:
  pgdata: {}
  reports: {}
  # The data class marker and its change history (deploy/db/data-class.ts).
  state: {}

# Owner-only files (directory 700, files 600) outside the repo; deploy/mac/secrets.sh creates the
# generated ones and deploy/mac/start.sh refuses to launch if any is missing or readable by others.
secrets:
  db_superuser_password: { file: "${LIMS_SECRETS_DIR:?}/db_superuser_password" }
  db_migrator_password: { file: "${LIMS_SECRETS_DIR:?}/db_migrator_password" }
  db_app_password: { file: "${LIMS_SECRETS_DIR:?}/db_app_password" }
  totp_encryption_key: { file: "${LIMS_SECRETS_DIR:?}/totp_encryption_key" }
  password_pepper: { file: "${LIMS_SECRETS_DIR:?}/password_pepper" }
  worker_upload_token: { file: "${LIMS_SECRETS_DIR:?}/worker_upload_token" }
  worker_alarm_token: { file: "${LIMS_SECRETS_DIR:?}/worker_alarm_token" }
  age_public_key: { file: "${LIMS_SECRETS_DIR:?}/age_public_key" }
  tunnel_config: { file: "${LIMS_SECRETS_DIR:?}/cloudflared.yml" }
  tunnel_credentials: { file: "${LIMS_SECRETS_DIR:?}/tunnel_credentials.json" }
