# The demo stack per ADR 0002. Run from the repo root: docker compose -f deploy/compose.yaml up -d --build
name: lims

x-app: &app
  build: { context: .., dockerfile: deploy/Dockerfile, target: api }
  image: lims-api:local
  # The secret named after the database user holds that user's password.
  entrypoint: ["sh", "-c", 'export LIMS_PG="postgres://$$LIMS_PG_USER:$$(cat /run/secrets/$$LIMS_PG_USER)@db:5432"; exec "$$@"', "--"]

services:
  db:
    build: { context: .., dockerfile: deploy/Dockerfile, target: db }
    image: lims-db:local
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres
    secrets: [postgres, lims_app]
    volumes: [pgdata:/var/lib/postgresql]
    healthcheck: { test: ["CMD", "pg_isready", "-U", "postgres"], interval: 5s, retries: 30 }
    restart: unless-stopped

  migrate:
    <<: *app
    environment: { LIMS_DB: lims, LIMS_PG_USER: postgres }
    secrets: [postgres]
    command: ["node", "packages/db/src/migrate.ts"]
    depends_on: { db: { condition: service_healthy } }
    restart: "no"

  api:
    <<: *app
    environment: { LIMS_DB: lims, LIMS_PG_USER: lims_app, NODE_ENV: production, HOST: 0.0.0.0, PORT: "3000" }
    secrets: [lims_app]
    command: ["node", "apps/api/src/app.ts"]
    depends_on: { migrate: { condition: service_completed_successfully } }
    restart: unless-stopped

  caddy:
    build: { context: .., dockerfile: deploy/Dockerfile, target: web }
    image: lims-web:local
    volumes: [caddy_data:/data, caddy_config:/config]
    depends_on: [api]
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:2026.9.3@sha256:072c067d25ccbe61d46e18f0d0723255f2bb5304f7317caa95b27031520ff92c
    command: ["tunnel", "--no-autoupdate", "run", "--token-file", "/run/secrets/tunnel_token"]
    secrets: [tunnel_token]
    depends_on: [caddy]
    restart: unless-stopped

secrets:
  postgres: { file: "${LIMS_SECRETS:?set LIMS_SECRETS to the owner-only secrets folder}/postgres" }
  lims_app: { file: "${LIMS_SECRETS:?set LIMS_SECRETS to the owner-only secrets folder}/lims_app" }
  tunnel_token: { file: "${LIMS_SECRETS:?set LIMS_SECRETS to the owner-only secrets folder}/tunnel_token" }

volumes:
  pgdata:
  caddy_data:
  caddy_config:
